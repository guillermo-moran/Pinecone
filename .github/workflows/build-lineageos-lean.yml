name: Build lean LineageOS image

on:
  workflow_dispatch:
    inputs:
      source_root:
        description: Persistent LineageOS checkout on the runner
        required: true
        default: /srv/lineageos/lineage-23.2
        type: string
      sync_source:
        description: Sync the moving lineage-23.2 branch before building
        required: true
        default: true
        type: boolean
      sync_jobs:
        description: Parallel repo sync jobs
        required: true
        default: "8"
        type: string
      build_jobs:
        description: Parallel Android build jobs
        required: true
        default: "16"
        type: string
      minimum_free_gib:
        description: Fail before sync unless this much disk is free
        required: true
        default: "350"
        type: string
      upload_artifact:
        description: Upload the compressed split boot bundle
        required: true
        default: true
        type: boolean
      artifact_retention_days:
        description: Short retention limits large-image storage cost
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "7"

permissions:
  contents: read

concurrency:
  group: lineageos-lean-build
  cancel-in-progress: false

jobs:
  build:
    # This label must point at a dedicated, trusted runner with >=64 GiB RAM
    # and >=400 GiB free disk. Do not expose this runner to pull_request jobs.
    runs-on: [self-hosted, linux, x64, lineageos-builder]
    timeout-minutes: 1440
    env:
      ANDROID_SOURCE_ROOT: ${{ inputs.source_root }}
      BUILD_OUTPUT: ${{ runner.temp }}/arm64viz-lineageos-${{ github.run_id }}-${{ github.run_attempt }}
      UPLOAD_OUTPUT: ${{ runner.temp }}/arm64viz-lineageos-upload-${{ github.run_id }}-${{ github.run_attempt }}
      LINEAGEOS_BRANCH: lineage-23.2
      LINEAGEOS_SYNC_JOBS: ${{ inputs.sync_jobs }}
      ARM64VIZ_BUILD_JOBS: ${{ inputs.build_jobs }}
      ARM64VIZ_MIN_FREE_GIB: ${{ inputs.minimum_free_gib }}
      ARM64VIZ_MIN_OUTPUT_FREE_GIB: "30"

    steps:
      - name: Check out arm64viz build support
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify dedicated Linux builder
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          mkdir -p "$ANDROID_SOURCE_ROOT"
          for tool in git git-lfs repo python3 qemu-img unzip zstd sha256sum; do
            command -v "$tool"
          done
          git config --global user.name >/dev/null 2>&1 || \
            git config --global user.name arm64viz-ci
          git config --global user.email >/dev/null 2>&1 || \
            git config --global user.email arm64viz-ci@invalid.local
          df -h "$ANDROID_SOURCE_ROOT" "${RUNNER_TEMP}"
          free -h

      - name: Sync, build, verify, and stage
        shell: bash
        env:
          LINEAGEOS_SYNC: ${{ inputs.sync_source && '1' || '0' }}
        run: |
          set -euo pipefail
          scripts/lineageos-lean/ci-build.sh \
            "$ANDROID_SOURCE_ROOT" \
            "$BUILD_OUTPUT"

      - name: Package sparse boot bundle
        shell: bash
        run: |
          set -euo pipefail
          scripts/lineageos-lean/package-ci-artifacts.sh \
            "$BUILD_OUTPUT" \
            "$UPLOAD_OUTPUT"
          cat "$UPLOAD_OUTPUT/bundle-metadata.txt"
          du -sh "$UPLOAD_OUTPUT"

      - name: Record build summary
        shell: bash
        run: |
          {
            echo '## Lean LineageOS build'
            echo
            echo 'Exact source revisions and image hashes are inside the artifact.'
            echo
            echo '```text'
            cat "$BUILD_OUTPUT/build-metadata.txt"
            cat "$UPLOAD_OUTPUT/bundle-metadata.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived boot bundle
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.UPLOAD_OUTPUT }}/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 0
